<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean</title>
</head>
<body>
       <div id ="demo"></div>
   <script type="text/javascript">
	  const output = document.getElementById("demo")
      let book = "maths";
      if (book == "history") {
         output.innerHTML="<b>History Book</b>";
      } else if (book == "maths") {
         output.innerHTML="<b>Maths Book</b>";
      } else if (book == "economics") {
         output.innerHTML="<b>Economics Book</b>";
      } else {
         output.innerHTML="<b>Unknown Book</b>";
      }

      // JS OPERATORS: || OR operator, && AND Operator, ! NOT Operator,
    </script>
    <p> Set the variable to a different value and then try... </p>
</body>
</html>
